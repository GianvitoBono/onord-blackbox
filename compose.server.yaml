name: opnord-blackbox

services:
  timescaledb:
    image: timescale/timescaledb-ha:pg17.11-ts2.30.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blackbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.server}
      POSTGRES_DB: ${POSTGRES_DB:-blackbox}
    volumes:
      - timescaledb_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [private]

  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-blackbox}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.server}@timescaledb:5432/${POSTGRES_DB:-blackbox}
      BIND_ADDR: 0.0.0.0:8080
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_COOKIE_SECURE: "true"
      DASHBOARD_CREDENTIALS_FILE: /var/lib/blackbox/dashboard-login.txt
      DEVICE_CREDENTIALS_FILE: /var/lib/blackbox/device-credentials.json
      VEHICLE_NAME: ${VEHICLE_NAME:-My car}
      DEVICE_NAME: ${DEVICE_NAME:-OnePlus Nord}
    volumes:
      - dashboard_secrets:/var/lib/blackbox
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [private]

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:-}
        VITE_MAP_ATTRIBUTION: ${VITE_MAP_ATTRIBUTION:-}
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.server}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.server}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [private]

networks:
  private:

volumes:
  timescaledb_data:
  dashboard_secrets:
  caddy_data:
  caddy_config:
